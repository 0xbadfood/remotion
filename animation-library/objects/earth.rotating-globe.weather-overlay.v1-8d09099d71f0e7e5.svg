<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><title>earth.rotating-globe.weather-overlay.v1</title><desc>Same canvas, center pivot and intrinsic tilt as earth.rotating-globe.v1. Northern cyclone arrow is counterclockwise, southern clockwise as viewed from above. Parcel curves eastward during northward travel; all paths are qualitative, not a solver. Attach overlay with identical size/pivot and synchronized rotation to the globe.</desc><defs><clipPath id="weather-globe"><ellipse cx="240" cy="240" rx="176" ry="173"/></clipPath><marker id="weather-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F3D177"/></marker></defs><g transform="rotate(-18 240 240)" clip-path="url(#weather-globe)"><ellipse cx="240" cy="240" rx="176" ry="44" fill="none" stroke="#D6F4FA" stroke-width="2" stroke-dasharray="6 6"/><path d="M82 160Q240 202 398 160M82 320Q240 362 398 320" fill="none" stroke="#9ACFE2" stroke-width="2" stroke-dasharray="4 6"/><path d="M300 240C300 200 310 170 340 145" fill="none" stroke="#A9E8CA" stroke-width="4" marker-end="url(#weather-tip)"/><path d="M206 150A26 26 0 1 0 180 176" fill="none" stroke="#F3D177" stroke-width="4" marker-end="url(#weather-tip)"/><path d="M296 320A26 26 0 1 1 270 294" fill="none" stroke="#F3D177" stroke-width="4" marker-end="url(#weather-tip)"/></g></svg>
