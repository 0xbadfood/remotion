<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480"><title>earth.rotating-globe.v1</title><desc>Static three-quarter diagram with schematic continent silhouettes, separate gold axis and pale equator. Flattening is slightly exaggerated for legibility, not a quantitative Earth model. Landmark coordinates are before the intrinsic -18-degree rotation around [240,240]; the frontier owns scene placement, force arrows and animation.</desc><defs><radialGradient id="ocean" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#257DA4"/><stop offset="1" stop-color="#103B5C"/></radialGradient><clipPath id="globe"><ellipse cx="240" cy="240" rx="176" ry="173"/></clipPath></defs><g transform="rotate(-18 240 240)"><ellipse cx="240" cy="240" rx="176" ry="173" fill="url(#ocean)" stroke="#A7D5E7" stroke-width="3"/><g clip-path="url(#globe)" fill="#67B9A3" opacity="0.9"><path d="M84 128L118 107L153 111L173 128L169 151L195 169L184 190L160 196L153 220L128 227L111 209L96 180Z"/><path d="M146 239L172 228L195 247L208 280L197 320L179 352L164 335L162 300L150 274Z"/><path d="M239 122L275 107L307 115L342 104L381 126L407 157L378 181L351 171L330 188L300 181L287 162L260 169L246 152Z"/><path d="M252 177L280 171L304 193L312 225L295 261L276 290L258 271L246 232L236 209Z"/><path d="M348 286L381 279L404 305L388 326L357 320L340 305Z"/></g><g fill="none" stroke="#9FD5E5" stroke-width="1.5" opacity="0.65"><ellipse cx="240" cy="240" rx="72" ry="173"/><ellipse cx="240" cy="240" rx="132" ry="173"/><path d="M82 172Q240 216 398 172M82 308Q240 352 398 308"/></g><path d="M64 240A176 44 0 0 1 416 240" fill="none" stroke="#D6F4FA" stroke-width="3" stroke-dasharray="7 6"/><path d="M64 240A176 44 0 0 0 416 240" fill="none" stroke="#D6F4FA" stroke-width="3"/><path d="M240 18V462" fill="none" stroke="#F5C978" stroke-width="3" stroke-dasharray="7 5"/><circle cx="240" cy="67" r="5" fill="#F5C978"/><circle cx="240" cy="413" r="5" fill="#F5C978"/></g></svg>
